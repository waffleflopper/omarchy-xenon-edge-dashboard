<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waffle Dashboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="grid">
      <!-- weather ------------------------------------------------------ -->
      <section class="card flip" id="weather-card">
        <div class="flip-inner">
          <div class="face front face-split" tabindex="0" role="button" aria-label="Weather. Activate for details.">
            <div class="wx-bg" id="wx-bg" aria-hidden="true"></div>
            <div class="clock">
              <div class="clock-time" id="clock-time">--:--</div>
              <div class="clock-date" id="clock-date">&hellip;</div>
            </div>
            <div class="weather">
              <div class="weather-glyph" id="weather-glyph">&#127774;</div>
              <div class="weather-body">
                <div class="weather-temp"><span id="weather-temp">--</span><span class="unit">&deg;</span></div>
                <div class="weather-label" id="weather-label">&hellip;</div>
                <div class="weather-meta" id="weather-meta"></div>
              </div>
            </div>
            <button class="flip-btn" type="button" aria-label="Show details">&#8250;</button>
          </div>

          <div class="face back">
            <header class="card-head">
              <span class="card-title">Weather</span>
              <span class="badge" id="wx-place"></span>
            </header>
            <div class="face-scroll">
              <div class="hourly" id="wx-hours"></div>
              <div class="stat-grid" id="wx-stats"></div>
              <div class="day-list" id="wx-days"></div>
            </div>
            <button class="flip-btn" type="button" aria-label="Back to summary">&#8249;</button>
          </div>
        </div>
      </section>

      <!-- temps / tailscale -------------------------------------------- -->
      <section class="card flip" id="temps-card">
        <div class="flip-inner">
          <div class="face front" tabindex="0" role="button" aria-label="Temperatures. Activate for Tailscale.">
            <header class="card-head">
              <span class="card-title">Temps</span>
              <span class="badge" id="temps-badge"></span>
            </header>
            <div class="face-scroll">
              <div class="temp-list" id="temps-list"></div>
            </div>
            <button class="flip-btn" type="button" aria-label="Show Tailscale">&#8250;</button>
          </div>

          <div class="face back">
            <header class="card-head">
              <span class="card-title">Tailscale</span>
              <span class="badge" id="ts-state"></span>
            </header>
            <div class="face-scroll">
              <div class="ts-self" id="ts-self"></div>
              <div class="ts-peers" id="ts-peers"></div>
            </div>
            <button class="flip-btn" type="button" aria-label="Back to temperatures">&#8249;</button>
          </div>
        </div>
      </section>

      <!-- usage: opencode go + codex (front) / codex detail (back) ------- -->
      <section class="card flip" id="usage-card">
        <div class="flip-inner">
          <div class="face front" tabindex="0" role="button" aria-label="Usage. Activate for Codex details.">
            <header class="card-head">
              <span class="card-title">Usage</span>
            </header>
            <div class="face-scroll between">
              <div class="usage-section">
                <div class="section-head">
                  <span class="section-label">OpenCode Go</span>
                  <span class="badge" id="opencode-plan"></span>
                </div>
                <div class="rows" id="opencode-rows"></div>
              </div>
              <div class="usage-section">
                <div class="section-head">
                  <span class="section-label">Codex</span>
                  <span class="badge" id="codex-plan"></span>
                </div>
                <div class="hero compact">
                  <div class="hero-num"><span id="codex-remaining">--</span><span class="pct">%</span></div>
                  <div class="hero-side">
                    <div class="hero-cap" id="codex-window">left</div>
                    <div class="hero-sub" id="codex-used"></div>
                  </div>
                </div>
                <div class="bar"><div class="bar-fill" id="codex-bar"></div></div>
                <div class="card-foot" id="codex-foot"></div>
              </div>
            </div>
            <button class="flip-btn" type="button" aria-label="Show Codex details">&#8250;</button>
          </div>

          <div class="face back">
            <header class="card-head">
              <span class="card-title">Codex</span>
              <span class="badge" id="codex-back-plan"></span>
            </header>
            <div class="face-scroll">
              <div class="pace" id="codex-pace"></div>
              <div class="spark-wrap" id="codex-spark"></div>
              <div class="stat-grid" id="codex-stats"></div>
              <div class="reset-list" id="codex-resets"></div>
            </div>
            <button class="flip-btn" type="button" aria-label="Back to usage">&#8249;</button>
          </div>
        </div>
      </section>

      <!-- volume / quick actions --------------------------------------- -->
      <section class="card flip" id="volume-card">
        <div class="flip-inner">
          <div class="face front">
            <header class="card-head">
              <span class="card-title">Volume</span>
              <span class="badge" id="vol-device-badge"></span>
            </header>
            <div class="vol-device" id="vol-device">&hellip;</div>
            <div class="vol-value" id="vol-value">--</div>
            <div class="vol-buttons">
              <button class="vbtn" id="vol-mute" type="button" aria-label="Toggle mute">&#128266;</button>
              <button class="vbtn" id="vol-down" type="button" aria-label="Volume down">&minus;</button>
              <button class="vbtn" id="vol-up" type="button" aria-label="Volume up">+</button>
            </div>
            <input class="vol-slider" id="vol-slider" type="range" min="0" max="100" step="1" value="0" aria-label="Volume" />
            <button class="flip-btn" type="button" aria-label="Show details">&#8250;</button>
          </div>

          <div class="face back">
            <header class="card-head">
              <span class="card-title">Quick actions</span>
              <span class="badge" id="qa-mic"></span>
            </header>
            <div class="action-grid" id="action-grid"></div>
            <div class="card-foot" id="action-foot"></div>
            <button class="flip-btn" type="button" aria-label="Back to summary">&#8249;</button>
          </div>
        </div>
      </section>
    </main>
    <div class="offline" id="offline">Reconnecting&hellip;</div>
    <script src="/app.js"></script>
  </body>
</html>
